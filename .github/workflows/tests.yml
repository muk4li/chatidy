name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-auth.txt
      - run: node --check web/app.js
      - run: node tests/test_sidebar_init.cjs
      - run: node --check tests/browser_smoke.cjs
      - run: python tests/run_ci.py

  local-stdlib:
    name: Local stdlib without OIDC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Deliberately do not install requirements-auth.txt here.
      - run: node --check web/app.js
      - run: node tests/test_sidebar_init.cjs
      - run: node --check tests/browser_smoke.cjs
      - run: python tests/run_ci.py
